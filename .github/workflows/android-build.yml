name: Build Elarb Tunnel Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Build Web App
      run: |
        npm install --legacy-peer-deps
        npm run build
        mkdir -p android/app/src/main/assets
        cp -r dist/* android/app/src/main/assets/

    - name: Configure Android SDK Path
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    - name: Generate Gradle Wrapper & Build APK
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Android APK File
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Elarb-Tunnel-APK-File
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Direct APK GitHub Release
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      continue-on-error: true
      with:
        tag_name: release-build-${{ github.run_number }}
        name: "Elarb Tunnel APK (Build ${{ github.run_number }})"
        body: |
          🚀 Elarb Tunnel Plus - تطبيق العرب للأندرويد
          - تم إصلاح جميع السيرفرات والبوابات الحقيقية لتعمل 100% على كافة شبكات المحمول المصرية (Vodafone, Orange, Etisalat, WE).
          - الحقوق محفوظة: تليجرام @elarp_vip | واتساب @uncle_elbhiry
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

